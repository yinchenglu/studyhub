name: studyhub
description: 学聚 —— 自用学习 App，资料全部存放在自己的 WebDAV 服务器
publish_to: 'none'

# 版本号规则（改这里就够了，APK 的 versionCode 由它算出来）：
#   +N 会成为基础 versionCode，Flutter 的 --split-per-abi 再按 ABI 加偏移：
#     armeabi-v7a → N + 1000
#     arm64-v8a   → N + 2000
#   所以 v1.3.0+4 出来的两个包是 versionCode 1004 / 2004。
# 历史：
#   v1.1.0+2 → 1002 / 2002
#   v1.2.0+3 → 1003 / 2003
#   v1.3.0+4 → 1004 / 2004   ← 递增即可直接覆盖安装
version: 1.3.0+4

environment:
  # 下限提到 3.12 不是随便写的：xml 7 要 ^3.11、torch_light / flutter_device_apps
  # 要 >=3.12，取最大值。
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------- 中文本地化（v1.3.0 新增）----------
  # 为什么必须加：
  #   系统的日期 / 时间选择器（showDatePicker / showTimePicker）文案
  #   ——「Select date」「Cancel」「OK」「January」这些 —— 全来自
  #   MaterialLocalizations，默认实现是英文的 DefaultMaterialLocalizations。
  #   只有挂上 GlobalMaterialLocalizations 才会变中文。
  #   日期计算和时间戳转换两个工具都要用中文的日期选择器。
  #
  # 连带的强制升级：flutter_localizations 在 Flutter 3.47.6 里要求
  #   intl ^0.20.3，所以下面 intl 必须从 ^0.19.0 一起提到 ^0.20.3，
  #   否则 pub get 直接 version solving failed。
  #   已核对过我们的用法：只用 DateFormat 和 initializeDateFormatting，
  #   这两个在 0.20 里都没变（0.20 主要是砍掉 Dart 2 支持和一批
  #   deprecated 的旧 API，跟我们无关）。
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 网络 + WebDAV
  dio: ^5.7.0
  # 必须是 7.x：syncfusion_flutter_pdf 要求 xml >=7.0.1，而 pdf 3.13 也要 xml 7。
  # 曾经为了迁就 pdf 3.12（它要求 xml <7）把这里压在 6.x，结果 pub get 直接冲突。
  # 我们只用 XmlDocument.parse / descendants / name.local / innerText，7.x 完全兼容。
  xml: ^7.0.1

  # 本地存储
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # 全格式播放器内核（libmpv），mkv / avi / flv / rmvb / ts 等都能放
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  # 下面这个包只提供原生解码库，代码里不需要 import，但绝对不能删
  media_kit_libs_android_video: ^1.3.6

  # Markdown 阅读
  flutter_markdown: ^0.7.3+1

  # 图片 / 动图（支持 GIF、WebP 动图）与磁盘缓存
  cached_network_image: ^3.4.1

  # 工具
  # 版本必须 >=0.20.3：Flutter 3.47.6 的 flutter_localizations 硬性要求 ^0.20.3。
  # 用法只涉及 DateFormat / initializeDateFormatting，0.20 完全兼容。
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  crypto: ^3.0.5
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.1.2

  # 下载到自定义目录时的存储权限申请
  permission_handler: ^11.3.1

  # ---- 笔记导出：Markdown → PDF（纯 Dart，不引入任何原生代码）----
  # 必须是 3.13+：3.12 要求 xml <7.0.0，而 syncfusion_flutter_pdf 要求 xml >=7.0.1，
  # 两者不可能共存（第 8 轮构建就死在这里）。3.13 起同样用 xml 7，冲突消失。
  pdf: ^3.13.0

  # ---- PDF 预览：Syncfusion 查看器（带原生 Android 代码，minSdk 要求 24，
  #      工作流里已把 minSdk 抬到 24）----
  syncfusion_flutter_pdfviewer: ^35.1.39

  # 导出后直接分享 / 打开外部查询页面
  # 必须停在 12.x，绝不能升 13：
  #   13.x 要 mime ^2.0.0 且 win32 ^6.0.1；
  #   而 image_picker 这条链要 mime ^1.0.4，
  #   media_kit_video → wakelock_plus 要 win32 ">=5.6.1 <6.0.0"。
  #   两个都是硬冲突，pub get 必然失败（第 8 轮云端构建就死在这条）。
  #   12.0.2 要 mime ">=1.0.4 <3.0.0" + win32 ^5.5.3，两边都兼容。
  #   已核对 12.0.2 源码：SharePlus.instance.share(ShareParams(...))、
  #   ShareParams 的 text/title/subject/files/previewThumbnail/sharePositionOrigin/uri
  #   全部存在，XFile 也照常导出 —— 所以代码一行都不用改。
  share_plus: ^12.0.2
  url_launcher: ^6.3.3

  # 运行服务器 tools 目录里的 html 小工具
  webview_flutter: ^4.14.1

  # 工具页要「保持屏幕常亮」（LED 屏幕、提词器、SOS 手电筒、屏幕坏点检测…）。
  # Flutter 的 SystemChrome 里**根本没有** setKeepScreenOn —— 之前凭印象写的那 20 处
  # 整个编不过，第 10 轮构建就死在这。这件事只能靠 wakelock_plus，
  # 它本来就在依赖树里（media_kit_video 拉的），现在改成直接依赖。
  # 上限必须钉死 <1.6.0：1.6.0 起它要 win32 ^6，会和 share_plus 的 win32 ^5 打架。
  wakelock_plus: ">=1.5.2 <1.6.0"

  # 量角器、挂画助手（水平仪）用重力/磁力传感器
  sensors_plus: ^7.1.1

  # ---- v1.3.0 新增：量角器 / 挂画助手改成实时摄像头取景 ----
  #
  # 为什么敢直接加（拷问过依赖树了）：
  #   camera 0.12.1 的传递依赖只有 async / meta / stream_transform /
  #   cross_file / plugin_platform_interface / camera_platform_interface，
  #   全是 Flutter 生态里最基础的那几个，且 cross_file 与 stream_transform
  #   本来就在树里（image_picker / media_kit 拉的）。
  #   没有任何 win32 / mime / xml 之类的老地雷 —— 这正是这个项目历次构建
  #   翻车的地方，所以每次加包前都要单独确认一遍。
  #
  # 版本下限 0.12.1：它要求 flutter >= 3.44，我们锁的是 3.47.6，正好够。
  #   0.11.x 那一串虽然也能用，但 0.12 起弃用了 `CameraController.takePicture`
  #   之外的一批旧 API，直接用新版省得以后再迁。
  #
  # 注意：camera 走 CameraX，会让 Gradle 多拉一批 androidx.camera 依赖，
  #   构建时间与 APK 体积都会涨一点（约 3~5 MB），这是必要成本。
  camera: ^0.12.1

  # 噪声测量（麦克风）
  noise_meter: ^6.0.0

  # SOS 手电筒
  torch_light: ^2.0.0

  # 应用管理：读取已安装应用列表（带 apkPath，可提取安装包）
  flutter_device_apps: ^1.0.0

  # 说明：以下依赖原本声明过但代码中未使用，为保证首次编译顺利已移除，
  # 需要时随时加回来即可：
  #   file_picker, package_info_plus

# ---- 依赖覆盖：解决 win32 三方死锁 ----
#
# 冲突链条（pub 原话）：
#   share_plus >=10.0.3 <13.0.0  要 win32 ^5.5.3
#   device_info_plus >=13.1.0    要 win32 ^6.0.1
#   而 syncfusion_flutter_pdfviewer >=33.2.13+1 强制 device_info_plus ^13.1.0
#   → share_plus 和 syncfusion 不可能共存，pub get 直接「version solving failed」。
#
# 为什么敢把 device_info_plus 压在 12.x：
#   翻遍 syncfusion_flutter_pdfviewer 35.1.39 的源码，它只用到三样东西 ——
#     DeviceInfoPlugin()、androidInfo.version.sdkInt、androidInfo.systemFeatures
#     （外加 web 端的 webBrowserInfo.maxTouchPoints）
#   这些从 device_info_plus 4.x 起就没变过。13.x 相对 12.x 的改动只发生在它自己的
#   Windows 实现里，而我们只出 Android 包，那条代码路径根本不会跑到。
#   device_info_plus 12.4.0 要 win32 ^5.11.0，与 share_plus 的 ^5.5.3 兼容 → 冲突消失。
#
# 另外注意：share_plus 一旦升到 13.x 就要求 mime ^2.0.0，
# 而 image_picker 这条链要 mime ^1.0.4，同样无解。所以 share_plus 必须停在 12.x。
dependency_overrides:
  device_info_plus: ">=12.0.0 <13.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 只作为「资源文件」打包，用 rootBundle 读字节喂给 PDF 生成器。
  # 故意不写进 fonts:，否则会被注册成界面字体（没必要，还容易和系统字体冲突）。
  assets:
    - assets/fonts/NotoSansSC-Regular.ttf

    # 番茄时钟的铃声（v1.3.0 新增）。
    # 用 .workbuddy/gen_sounds.py 合成，16-bit PCM WAV / 22050 Hz / 单声道，
    # 7 个文件加起来 340 KB。播放走已有的 media_kit（asset:// scheme），
    # 不额外引入音频包。整个目录一起打包，加铃声直接丢文件进来即可。
    - assets/sounds/
