name: 编译 APK

# 什么时候触发：
#   1. 在 GitHub 网页上点 "Run workflow" 手动触发
#   2. 往 main / master 分支推代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 需要写权限才能创建 Release / 推送日志分支
permissions:
  contents: write

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取源码 ----------
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- 2. JDK 17（Gradle 编译安卓必须 17）----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- 3. Flutter SDK ----------
      # 固定 3.24.5 是有意的：
      #   这个版本的 Android 模板用 Groovy build.gradle，
      #   和本项目 android_custom/app_build.gradle 完全对得上。
      #   换成 3.29+ 模板改用 build.gradle.kts，覆盖会失败。
      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ---------- 4. 生成 Android 工程骨架 ----------
      # 关键：在临时目录生成骨架，只把 android/ 拷回来。
      # 这样绝对不会碰到我们写好的 lib/ 和 pubspec.yaml。
      - name: 生成 Android 骨架并覆盖配置
        run: |
          set -e
          flutter create \
            --org com.studyhub \
            --platforms=android \
            --project-name studyhub \
            /tmp/skeleton

          rm -rf android
          cp -r /tmp/skeleton/android ./android
          cp /tmp/skeleton/.metadata ./.metadata

          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_custom/app_build.gradle    android/app/build.gradle

          # ★ 修正 MainActivity 的包名 ★
          # app_build.gradle 把 namespace 定为 com.studyhub.app，
          # 而模板生成的 MainActivity 在 com.studyhub.studyhub 下，
          # 会导致启动时找不到类而闪退。这里删掉模板的，换成包名正确的一份。
          find android/app/src/main -name "MainActivity.kt" -delete
          find android/app/src/main -name "MainActivity.java" -delete
          mkdir -p android/app/src/main/kotlin/com/studyhub/app
          cp android_custom/MainActivity.kt \
             android/app/src/main/kotlin/com/studyhub/app/MainActivity.kt

          echo "----- 包名自检 -----"
          echo "namespace    : $(grep -m1 'namespace' android/app/build.gradle)"
          echo "applicationId: $(grep -m1 'applicationId' android/app/build.gradle)"
          echo "MainActivity : $(head -1 android/app/src/main/kotlin/com/studyhub/app/MainActivity.kt)"
          find android/app/src/main -name "MainActivity.*"

      # ---------- 5. 装依赖 ----------
      - name: 下载依赖
        run: flutter pub get

      # ---------- 6. 静态检查 ----------
      # 结果写入 analyze.log，失败时会被推送到 ci-logs 分支便于排查。
      # 这一步本身不阻断构建（真正的编译在下一步）。
      - name: 代码检查（不阻断构建）
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          echo "analyze 退出码: $?"
          echo "----- 错误行（最多 60 条）-----"
          grep -E "error " analyze.log | head -60 || true
          echo "----- 错误总数 -----"
          grep -cE "error " analyze.log || true
          exit 0

      # ---------- 7. 编译 ----------
      # tee 把完整输出写进 build.log，失败时能拿到全部报错。
      - name: 编译 release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # ---------- 8. 同时产出一个只含 arm64 的小包 ----------
      - name: 编译 arm64 精简 APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build-arm64.log

      # ---------- 9. 上传产物 ----------
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90
          if-no-files-found: warn

      # ---------- 10. 发布 Release ----------
      # Release 里是直接的 .apk 文件，点一下就能下载，不用先下 zip 再解压。
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 学聚 APK v${{ github.run_number }}
          body: |
            自动构建产出，可直接下载安装。

            - `app-release.apk` —— 通用包，兼容所有安卓手机（体积较大）
            - `app-arm64-v8a-release.apk` —— 精简包，体积约为通用包一半；
              近几年的手机基本都是 arm64，**优先装这个**

            安装前需在手机上允许「安装未知来源应用」。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          fail_on_unmatched_files: false

      # ---------- 11. 失败时：把日志推送到 ci-logs 分支 ----------
      # 这样即使不登录 GitHub、不提供 token，也能直接读到完整的构建报错。
      - name: 失败时导出日志到 ci-logs 分支
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/logdump
          cd "$GITHUB_WORKSPACE"

          # 各种日志
          cp analyze.log build.log build-arm64.log /tmp/logdump/ 2>/dev/null
          cp pubspec.lock /tmp/logdump/ 2>/dev/null

          # 环境诊断信息
          flutter doctor -v > /tmp/logdump/flutter-doctor.log 2>&1
          java -version > /tmp/logdump/java-version.log 2>&1
          {
            echo "===== ANDROID_SDK_ROOT ===== $ANDROID_SDK_ROOT"
            echo "===== 已装 NDK ====="
            ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "(无 ndk 目录)"
            echo "===== build.gradle 关键行 ====="
            grep -nE "namespace|applicationId|minSdk|compileSdk|ndkVersion|targetSdk" android/app/build.gradle 2>/dev/null
            echo "===== gradle wrapper 版本 ====="
            cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
          } > /tmp/logdump/env-info.log 2>&1

          echo "===== 导出内容 ====="
          ls -la /tmp/logdump/

          cd /tmp/logdump
          git init -b ci-logs -q
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af
          git commit -q -m "构建失败日志 $(date -u +%Y%m%dT%H%M%SZ)" || echo "无内容可提交"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs && echo "✅ 日志已推送到 ci-logs 分支"

      # ---------- 12. 同时留一份 Artifact（方便人工下载）----------
      - name: 失败时上传日志 Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
            build-arm64.log
          retention-days: 30
          if-no-files-found: ignore
