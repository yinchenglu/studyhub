name: 编译 APK

# 什么时候触发：
#   1. 在 GitHub 网页上点 "Run workflow" 手动触发
#   2. 往 main / master 分支推代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 需要写权限才能创建 Release / 推送日志分支
permissions:
  contents: write

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取源码 ----------
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- 2. JDK 17（Gradle 编译安卓必须 17）----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- 3. Flutter SDK ----------
      # 用当前最新稳定版。理由：本项目依赖的媒体库（media_kit 系）
      # 要求 compileSdk 36，而 compileSdk 由 Flutter 版本决定。
      # 老版本 Flutter 给不到 36，会在 Gradle 阶段直接失败。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      # ---------- 4. 生成 Android 工程骨架 ----------
      # 在临时目录生成骨架，只把 android/ 拷回来，
      # 保证不会覆盖我们写好的 lib/ 和 pubspec.yaml。
      #
      # 关键决策：只覆盖 AndroidManifest.xml，不动任何 Gradle 脚本。
      # 原因：Flutter 模板在版本之间会在 Groovy(build.gradle) 与
      # Kotlin DSL(build.gradle.kts) 之间切换，自己维护构建脚本极易失效。
      # 交给模板维护后，compileSdk / ndkVersion / 签名回退（release 用 debug 签名）
      # 全部自动正确，我们只负责声明权限。
      - name: 生成 Android 骨架并覆盖清单
        run: |
          set -e
          flutter create \
            --org com.yinchenglu \
            --platforms=android \
            --project-name studyhub \
            /tmp/skeleton

          rm -rf android
          cp -r /tmp/skeleton/android ./android
          cp /tmp/skeleton/.metadata ./.metadata

          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          echo "========== 自检 =========="
          echo "--- Android 构建脚本（模板自带，未改动）---"
          ls -1 android/app/build.gradle* 2>/dev/null
          echo "--- namespace / applicationId ---"
          grep -nE "namespace|applicationId" android/app/build.gradle* 2>/dev/null || true
          echo "--- MainActivity（模板生成，包名需与 namespace 一致）---"
          find android/app/src/main -name "MainActivity.*"
          head -1 $(find android/app/src/main -name "MainActivity.kt" | head -1) 2>/dev/null || true
          echo "--- 清单关键项检查（应为 2：extractNativeLibs + usesCleartextTraffic）---"
          grep -cE "extractNativeLibs|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml
          echo "--- 清单里的启动活动 ---"
          grep -n "MainActivity" android/app/src/main/AndroidManifest.xml
          echo "=========================="

      # ---------- 5. 装依赖 ----------
      - name: 下载依赖
        run: flutter pub get

      # ---------- 6. 打印关键依赖版本（便于排查）----------
      - name: 依赖版本速览
        run: |
          set +e
          grep -A1 -E "^  (media_kit|media_kit_video|media_kit_libs_android_video|flutter_markdown|package_info_plus|wakelock_plus|image_picker|cached_network_image|sqflite|dio|flutter_riverpod):" pubspec.lock | grep -E "^  \w|version" || true

      # ---------- 7. 静态检查 ----------
      # 结果写入 analyze.log，失败时会被推送到 ci-logs 分支便于排查。
      # 这一步本身不阻断构建（真正的编译在下一步）。
      - name: 代码检查（不阻断构建）
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          echo "analyze 退出码: $?"
          echo "----- 错误总数 -----"
          grep -cE "^\s*error" analyze.log || true
          echo "----- 错误明细（最多 80 条）-----"
          grep -E "^\s*error" analyze.log | head -80 || true
          exit 0

      # ---------- 8. 编译 ----------
      # tee 把完整输出写进 build.log，失败时能拿到全部报错。
      - name: 编译 release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # ---------- 9. 同时产出一个只含 arm64 的小包 ----------
      - name: 编译 arm64 精简 APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build-arm64.log

      # ---------- 10. 上传产物 ----------
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 90
          if-no-files-found: warn

      # ---------- 11. 发布 Release ----------
      # Release 里是直接的 .apk 文件，点一下就能下载，不用先下 zip 再解压。
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 学聚 APK v${{ github.run_number }}
          body: |
            自动构建产出，可直接下载安装。

            - `app-release.apk` —— 通用包，兼容所有安卓手机（体积较大）
            - `app-arm64-v8a-release.apk` —— 精简包，体积约为通用包一半；
              近几年的手机基本都是 arm64，**优先装这个**

            安装前需在手机上允许「安装未知来源应用」。
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          fail_on_unmatched_files: false

      # ---------- 12. 失败时：把日志推送到 ci-logs 分支 ----------
      # 这样即使不登录 GitHub、不提供 token，也能直接读到完整的构建报错。
      - name: 失败时导出日志到 ci-logs 分支
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/logdump
          cd "$GITHUB_WORKSPACE"

          cp analyze.log build.log build-arm64.log /tmp/logdump/ 2>/dev/null
          cp pubspec.lock /tmp/logdump/ 2>/dev/null

          flutter doctor -v > /tmp/logdump/flutter-doctor.log 2>&1
          java -version > /tmp/logdump/java-version.log 2>&1
          {
            echo "===== Flutter 版本 ====="; flutter --version 2>&1
            echo "===== ANDROID_SDK_ROOT ===== $ANDROID_SDK_ROOT"
            echo "===== 已装 NDK ====="; ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "(无 ndk 目录)"
            echo "===== 已装 Android Platform ====="; ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null
            echo "===== Android 构建脚本 ====="
            ls -1 android/app/build.gradle* 2>/dev/null
            cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts 2>/dev/null
            echo "===== settings 脚本 ====="
            cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null
            echo "===== gradle wrapper 版本 ====="
            cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
            echo "===== 清单 ====="
            cat android/app/src/main/AndroidManifest.xml 2>/dev/null
          } > /tmp/logdump/env-info.log 2>&1

          echo "===== 导出内容 ====="
          ls -la /tmp/logdump/

          cd /tmp/logdump
          git init -b ci-logs -q
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af
          git commit -q -m "构建失败日志 $(date -u +%Y%m%dT%H%M%SZ)" || echo "无内容可提交"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs && echo "日志已推送到 ci-logs 分支"

      # ---------- 13. 同时留一份 Artifact（方便人工下载）----------
      - name: 失败时上传日志 Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
            build-arm64.log
          retention-days: 30
          if-no-files-found: ignore
