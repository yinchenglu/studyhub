name: 编译 APK

# 什么时候触发：
#   1. 在 GitHub 网页上点 "Run workflow" 手动触发
#   2. 往 main / master 分支推代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 需要写权限才能创建 Release / 推送日志分支
permissions:
  contents: write

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取源码 ----------
      # v2.0.0+40：fetch-depth 改成 0（完整历史）。
      # 原因：后面「同步到 Gitee」那步要往另一个远端 push，
      # 浅克隆（默认 depth=1）推送时 git 缺父提交对象，
      # 经常直接以 `shallow update not allowed` 被远端拒绝。
      # 本仓库完整历史只有 3 MB，全量拉取几秒钟的事。
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. JDK 17（Gradle 编译安卓必须 17）----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- 3. Flutter SDK ----------
      # 版本刻意锁死（不用 latest）。理由：
      #   a) media_kit 系插件要求 compileSdk 36，compileSdk 由 Flutter 版本决定，
      #      老版本（如 3.24.x 只给 34）会在 Gradle 阶段直接失败；
      #   b) 3.27 起 ThemeData.cardTheme 的类型从 CardTheme 改为 CardThemeData，
      #      锁住版本可避免被上游变更再次打断。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      # ---------- 4. 缓存 Gradle 依赖 ----------
      # 每轮构建大头是重复下载 Gradle 依赖，缓存后能省 1~2 分钟。
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ---------- 5. 生成 Android 工程骨架 ----------
      # 在临时目录生成骨架，只把 android/ 拷回来，
      # 保证不会覆盖我们写好的 lib/ 和 pubspec.yaml。
      #
      # 设计决策：只覆盖 AndroidManifest.xml，Gradle 脚本一律用模板自带的，
      # 但必须「注入」一段 jniLibs.useLegacyPackaging = true（见下方说明）。
      - name: 生成 Android 骨架并覆盖清单
        run: |
          set -e
          flutter create \
            --org com.yinchenglu \
            --platforms=android \
            --project-name studyhub \
            /tmp/skeleton

          rm -rf android
          cp -r /tmp/skeleton/android ./android
          cp /tmp/skeleton/.metadata ./.metadata

          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # ---------- 注入自定义启动图标 ----------
          # android_custom/res 下的文件按**相对路径**逐个覆盖进骨架的 res/：
          #   mipmap-*/ic_launcher.png      旧系统（<8.0）的位图
          #   mipmap-*/ic_launcher_bg.png   自适应图标背景层（整块渐变）
          #   mipmap-*/ic_launcher_fg.png   自适应图标前景层（透明底 + 白色书本）
          #   mipmap-anydpi-v26/ic_launcher.xml
          #
          # 为什么不能用 cp -r 整目录拷：
          #   cp -r a/res/* b/res/ 在 b/res/mipmap-mdpi 已存在（flutter create 一定生成）
          #   时行为符合预期，但只要哪个子目录名对不上就会把源目录整个塞进去，
          #   变成 res/mipmap-mdpi/mipmap-mdpi/ 两层嵌套，图标静默失效还不报错。
          #   逐文件按相对路径覆盖没有这种歧义，缺的目录顺手 mkdir。
          #
          # 资源名故意叫 ic_launcher_bg / ic_launcher_fg 这种「独有名」，
          # 不会和 flutter create 模板自带的 drawable / color 资源撞名
          # （撞名 = duplicate resource，AAPT 直接编译失败）。
          if [ ! -d android_custom/res ]; then
            echo "!!! android_custom/res 不存在，图标会是 Flutter 默认的"
            exit 1
          fi
          ICON_N=$(find android_custom/res -type f | wc -l)
          if [ "$ICON_N" -eq 0 ]; then
            echo "!!! android_custom/res 是空的"
            exit 1
          fi
          find android_custom/res -type f | while IFS= read -r f; do
            rel="${f#android_custom/res/}"
            mkdir -p "android/app/src/main/res/$(dirname "$rel")"
            cp -f "$f" "android/app/src/main/res/$rel"
          done
          echo "已注入图标资源 $ICON_N 个文件"
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "!!! 旧系统图标没拷过去"; exit 1; }
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_fg.png || { echo "!!! 自适应图标前景缺失"; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || { echo "!!! 自适应图标描述缺失"; exit 1; }
          echo "--- xxxhdpi 目录内容 ---"
          ls -1 android/app/src/main/res/mipmap-xxxhdpi/
          echo "=========================="

          # ---------- 注入 jniLibs.useLegacyPackaging = true ----------
          # 为什么必须：
          #   media_kit 的 libmpv 要求 .so 解压到文件系统后才能加载
          #   （media_kit_libs_android_video 1.0.2 changelog: "perf: enable extractNativeLibs"）。
          #   AGP 8 + minSdk>=23 的默认行为是不解压（页面对齐直接 mmap），libmpv 会加载失败。
          # 为什么不写在 AndroidManifest.xml：
          #   新版 AGP 在 packageRelease 任务里会直接报错 ——
          #   "Avoid setting android:extractNativeLibs=true explicitly in AndroidManifest.xml,
          #    and instead set android.packagingOptions.jniLibs.useLegacyPackaging to true in the build script."
          python3 - <<'PY'
          import os
          import re

          path = None
          for c in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(c):
                  path = c
                  break
          assert path, "找不到 android/app/build.gradle(.kts)"
          kotlin = path.endswith(".kts")
          src = open(path, encoding="utf-8").read()
          original = src

          # ---------- 1. jniLibs.useLegacyPackaging = true ----------
          if "useLegacyPackaging" in src:
              print("已存在 useLegacyPackaging，跳过注入")
          else:
              inject = (
                  "android {\n"
                  "    packagingOptions {\n"
                  "        jniLibs {\n"
                  "            useLegacyPackaging = true\n"
                  "        }\n"
                  "    }\n"
              )
              src = src.replace("android {", inject, 1)
              assert src != original, "未找到 android { 块，注入失败"
              print("已注入 useLegacyPackaging = true")

          # ---------- 2. minSdk 至少 24 ----------
          # 为什么必须抬到 24：
          #   syncfusion_flutter_pdfviewer / webview_flutter_android /
          #   url_launcher_android / audio_streamer / permission_handler_android /
          #   flutter_device_apps_android 这几个原生插件都声明了 minSdkVersion 24。
          #   如果 app 的 minSdk 比它们低，Gradle 的 manifest merger 会直接失败：
          #   "uses-sdk:minSdkVersion X cannot be smaller than version 24 declared in library"。
          # 用 maxOf / Math.max 是为了「只上不下」：万一 Flutter 模板默认值比 24 还高，
          # 也不会被我们改小。
          if "MIN_SDK_BUMP_24" in src:
              print("minSdk 已注入过，跳过")
          else:
              m = re.search(r"minSdk\s*=\s*([^\n]+)", src)
              if m:
                  value = m.group(1).strip()
                  # 去掉行内注释再判断
                  bare = value.split("//")[0].strip()
                  src = src[: m.start()] + "minSdk = %s(%s, 24) /* MIN_SDK_BUMP_24 */" % (
                      "maxOf" if kotlin else "Math.max",
                      bare,
                  ) + src[m.end():]
                  print("已把 minSdk 抬到至少 24（原值 %s）" % bare)
              else:
                  m2 = re.search(r"minSdkVersion\s+([^\n]+)", src)
                  if not m2:
                      raise SystemExit("找不到 minSdk，注入失败")
                  value = m2.group(1).strip().split("//")[0].strip()
                  src = src[: m2.start()] + "minSdkVersion Math.max(%s, 24) /* MIN_SDK_BUMP_24 */" % value + src[m2.end():]
                  print("已把 minSdkVersion 抬到至少 24（原值 %s）" % value)

          open(path, "w", encoding="utf-8").write(src)
          print("写入完成 ->", path)
          PY

          echo "========== 自检 =========="
          echo "--- Android 构建脚本 ---"
          ls -1 android/app/build.gradle*
          echo "--- 注入结果（必须能看到 useLegacyPackaging 与 MIN_SDK_BUMP_24）---"
          grep -nE "useLegacyPackaging|MIN_SDK_BUMP_24" android/app/build.gradle* || { echo "!!! 注入失败，终止"; exit 1; }
          echo "--- minSdk 实际表达式 ---"
          grep -nE "minSdk" android/app/build.gradle* | head -5
          echo "--- 中文字体资源（PDF 导出依赖它，缺了整个构建会失败）---"
          ls -la assets/fonts/ || { echo "!!! assets/fonts 目录不存在"; exit 1; }
          test -s assets/fonts/NotoSansSC-Regular.ttf || { echo "!!! 中文字体缺失或为空"; exit 1; }
          echo "字体大小：$(stat -c%s assets/fonts/NotoSansSC-Regular.ttf) 字节"
          # v1.8.0 新增：翻页时钟的两款数字字体（pubspec 的 fonts: 段引用了它们）。
          # 少了任何一个，pubspec 里的 fonts 声明就会指向不存在的文件，
          # `flutter pub get` 或 assembleRelease 直接失败 —— 这里提前说清楚是哪个。
          for f in ChakraPetch-Bold.ttf BebasNeue-Regular.ttf; do
            test -s "assets/fonts/$f" || { echo "!!! 翻页时钟字体缺失或为空：assets/fonts/$f"; exit 1; }
            echo "  时钟字体 $f：$(stat -c%s "assets/fonts/$f") 字节"
          done
          grep -nE "^  fonts:|family: Flip" pubspec.yaml || { echo "!!! pubspec 里的 fonts: 段不见了"; exit 1; }
          # v1.8.0：拼音排序表 + 户籍区县表。
          # 拼音表要是漏了，App 只会**静默降级**成码点序（不崩、不报错，
          # 就是中文排得跟电脑不一样）—— 这种错最不该留到用户手里，
          # 所以在这里硬拦。行数一并核一下，防的是文件被截断/空了。
          test -s assets/data/pinyin_sort.txt || { echo "!!! assets/data/pinyin_sort.txt 缺失或为空"; exit 1; }
          PYLINES=$(wc -l < assets/data/pinyin_sort.txt)
          echo "  拼音表 $PYLINES 行（应约 6763 行）"
          if [ "$PYLINES" -lt 6000 ]; then
            echo "!!! 拼音表行数只有 $PYLINES，明显不完整"
            exit 1
          fi
          test -s assets/data/id_region.json || { echo "!!! assets/data/id_region.json 缺失或为空"; exit 1; }
          echo "--- 清单关键项（只应有 usesCleartextTraffic，绝不能有 extractNativeLibs）---"
          grep -nE "usesCleartextTraffic|extractNativeLibs" android/app/src/main/AndroidManifest.xml || true
          grep -nE "RECORD_AUDIO|QUERY_ALL_PACKAGES|FLASHLIGHT" android/app/src/main/AndroidManifest.xml || echo "(提示：工具类权限没读到)"
          if grep -q "extractNativeLibs" android/app/src/main/AndroidManifest.xml; then
            echo "!!! 清单里出现了 extractNativeLibs，会导致 packageRelease 失败"
            exit 1
          fi
          echo "=========================="

          # ---------- 注入自定义 MainActivity.kt ----------
          # 为什么必须注入：
          #   直尺工具要按真实尺寸画刻度，需要面板真实物理 DPI（DisplayMetrics.xdpi）。
          #   Flutter 框架没暴露这个值，只能在原生侧架一个 MethodChannel 递过来。
          #   `flutter create` 生成的是空壳 MainActivity，覆盖掉即可。
          #
          # 为什么不干脆用 densityDpi：
          #   那是厂商从 240/320/420/480 档位里挑的标称值，跟面板真实密度能差 7%，
          #   照它画的尺子量 30 cm 会差 2 cm。
          #
          # 包名不写死：从骨架自己生成的 MainActivity 里读出来再替换，
          # 这样以后改 --org 或 project-name 也不用回来动这个文件。
          SKEL_MA=$(find android/app/src/main -name "MainActivity.kt" | head -1)
          if [ -z "$SKEL_MA" ]; then
            echo "!!! 找不到骨架生成的 MainActivity.kt，无法注入物理 DPI 桥"
            find android/app/src/main -name "MainActivity*" || true
            exit 1
          fi
          ACTUAL_PKG=$(grep -m1 '^package ' "$SKEL_MA" | sed -e 's/^package[[:space:]]*//' -e 's/[;[:space:]]*$//')
          echo "MainActivity 路径：$SKEL_MA"
          echo "MainActivity 包名：$ACTUAL_PKG"
          if [ -z "$ACTUAL_PKG" ]; then
            echo "!!! 读不到包名，终止"
            exit 1
          fi
          sed "s/^package __PACKAGE__/package $ACTUAL_PKG/" \
            android_custom/MainActivity.kt > "$SKEL_MA"
          echo "----- 注入后的 MainActivity.kt 头部 -----"
          head -12 "$SKEL_MA"
          echo "----- 注入自检（必须能看到包名与 channel）-----"
          grep -nE "^package |studyhub/display|physicalDpi" "$SKEL_MA" || { echo "!!! MainActivity 注入失败"; exit 1; }
          if grep -q "__PACKAGE__" "$SKEL_MA"; then
            echo "!!! 包名占位符没被替换掉"
            exit 1
          fi
          echo "=========================="

      # ---------- 5.5 注入固定签名（v1.8.0 新增）----------
      # 为什么必须做
      # ============
      # 原来压根没配 signingConfig，`flutter build apk --release` 就落到
      # flutter create 模板自带的那句 `signingConfig = signingConfigs.getByName("debug")`
      # —— 用 **debug 密钥**签名。而 debug keystore（~/.android/debug.keystore）
      # **不在 Gradle 缓存里**，GitHub Actions 每次都是全新机器，
      # 于是每个 run 都现场 `keytool -genkeypair` 生成一对全新的密钥。
      #
      # 实测（`.workbuddy/apk_sig.py` 把历史包的证书全抠出来比对）：
      #   v1.1.0 ~ v1.7.0 共 7 个包 = **7 个完全不同的证书**，主题都是 CN=Android Debug。
      # Android 只认证书、不认版本号 —— 证书变了就当是另一个 App，直接拒绝覆盖安装，
      # 这就是「提示签名不一致」的唯一原因。
      #
      # 修法：keystore 固定在仓库外，base64 进 Secrets，CI 每次解码同一个文件。
      #
      # Secrets 缺了怎么办
      # ==================
      # **不阻断构建**，退回 debug 签名（否则整条流水线会被卡死），
      # 但把「本包不能覆盖安装」写进 GITHUB_ENV，让 Release 正文顶上一行醒目警告。
      - name: 注入固定签名
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::没配 SIGNING_KEYSTORE_BASE64 —— 本次仍用 debug 签名，产出的 APK 无法覆盖安装"
            echo "SIGN_NOTE=⚠️ **本包用临时 debug 密钥签名，不能覆盖安装**（Secrets 里缺 SIGNING_KEYSTORE_BASE64）" >> "$GITHUB_ENV"
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/studyhub-release.jks
          test -s /tmp/studyhub-release.jks || { echo "!!! keystore 解码为空，检查 SIGNING_KEYSTORE_BASE64"; exit 1; }
          KS_BYTES=$(stat -c%s /tmp/studyhub-release.jks)
          echo "keystore 解码完成：$KS_BYTES 字节"
          if [ "$KS_BYTES" -lt 500 ]; then
            echo "!!! keystore 只有 $KS_BYTES 字节，base64 大概是错的"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=/tmp/studyhub-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo "已写 android/key.properties（storeFile 走绝对路径，省得算相对位置）"

          python3 - <<'PY'
          import os
          import re

          path = None
          for c in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(c):
                  path = c
                  break
          assert path, "找不到 android/app/build.gradle(.kts)"
          kotlin = path.endswith(".kts")
          src = open(path, encoding="utf-8").read()

          if "STUDYHUB_SIGNING" in src:
              print("已注入过签名配置，跳过")
          else:
              if kotlin:
                  head = (
                      "import java.util.Properties\n"
                      "import java.io.FileInputStream\n"
                      "\n"
                      "// STUDYHUB_SIGNING —— key.properties 由 CI 用 Secrets 现场生成\n"
                      "val _shKp = Properties()\n"
                      "val _shKpFile = rootProject.file(\"key.properties\")\n"
                      "if (_shKpFile.exists()) { _shKp.load(FileInputStream(_shKpFile)) }\n"
                      "\n"
                  )
                  sig = (
                      "    signingConfigs {\n"
                      "        create(\"release\") {\n"
                      "            keyAlias = _shKp[\"keyAlias\"] as String\n"
                      "            keyPassword = _shKp[\"keyPassword\"] as String\n"
                      "            storeFile = file(_shKp[\"storeFile\"] as String)\n"
                      "            storePassword = _shKp[\"storePassword\"] as String\n"
                      "        }\n"
                      "    }\n"
                  )
              else:
                  head = (
                      "// STUDYHUB_SIGNING —— key.properties 由 CI 用 Secrets 现场生成\n"
                      "def _shKp = new Properties()\n"
                      "def _shKpFile = rootProject.file('key.properties')\n"
                      "if (_shKpFile.exists()) { _shKp.load(new FileInputStream(_shKpFile)) }\n"
                      "\n"
                  )
                  sig = (
                      "    signingConfigs {\n"
                      "        release {\n"
                      "            keyAlias _shKp['keyAlias']\n"
                      "            keyPassword _shKp['keyPassword']\n"
                      "            storeFile file(_shKp['storeFile'])\n"
                      "            storePassword _shKp['storePassword']\n"
                      "        }\n"
                      "    }\n"
                  )
              src = head + src
              before = src
              src = src.replace("android {", "android {\n" + sig, 1)
              assert src != before, "注入 signingConfigs 失败：找不到 android { 块"
              print("已注入 signingConfigs.release")

          # buildTypes.release 的签名从 debug 换成 release
          before = src
          src = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                       'signingConfig = signingConfigs.getByName("release")', src)
          if src == before:
              src = re.sub(r'signingConfig\s+signingConfigs\.debug',
                           'signingConfig signingConfigs.release', src)
          assert src != before, "替换 release 的 signingConfig 失败（模板可能变了）"

          open(path, "w", encoding="utf-8").write(src)
          print("写入完成 ->", path)
          PY

          echo "========== 签名注入自检 =========="
          grep -nE "STUDYHUB_SIGNING|signingConfigs|getByName\(\"release\"\)|signingConfigs\.release" android/app/build.gradle* \
            || { echo "!!! 签名注入没生效"; exit 1; }
          if grep -qE 'getByName\("debug"\)|signingConfigs\.debug' android/app/build.gradle*; then
            echo "!!! release 还在用 debug 签名"
            exit 1
          fi
          echo "--- key.properties（隐去密码）---"
          sed -E 's/(Password=).*/\1****/' android/key.properties
          echo "=================================="

          echo "SIGN_NOTE=✅ 已用固定 release 密钥签名，可直接覆盖安装" >> "$GITHUB_ENV"
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      # ---------- 6. 装依赖 ----------
      # 一定要 tee 到 pub-get.log：pub get 一旦冲突，报错是唯一有用的线索，
      # 而失败时 8~12 步全被跳过，analyze.log / build.log 根本不会生成。
      # 之前就是因为没存这个文件，白瞎了一轮构建，只能靠猜。
      - name: 下载依赖
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub-get.log

      # ---------- 7. 打印关键依赖版本（便于排查）----------
      - name: 依赖版本速览
        run: |
          set +e
          grep -A1 -E "^  (media_kit|media_kit_video|media_kit_libs_android_video|flutter_markdown|package_info_plus|wakelock_plus|image_picker|cached_network_image|sqflite|dio|flutter_riverpod|pdf|syncfusion_flutter_pdfviewer|share_plus|url_launcher|webview_flutter|sensors_plus|noise_meter|torch_light|flutter_device_apps|permission_handler|xml):" pubspec.lock | grep -E "^  \w|version" || true
          echo "----- 中文字体资源 -----"
          ls -la assets/fonts/ 2>/dev/null || echo "(fonts 目录不存在)"

      # ---------- 8. 静态检查 ----------
      # 结果写入 analyze.log，失败时会被推送到 ci-logs 分支便于排查。
      # 这一步本身不阻断构建（真正的编译在下一步），
      # 但 analyze 的 error 条数就是「能否编译通过」的直接指标。
      - name: 代码检查（不阻断构建）
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          echo "analyze 退出码: $?"
          echo "----- 错误总数 -----"
          grep -cE "^\s*error" analyze.log || true
          echo "----- 错误明细（最多 80 条）-----"
          grep -E "^\s*error" analyze.log | head -80 || true
          exit 0

      # ---------- 9. 编译 ----------
      # 用 --split-per-abi 一次产出各架构独立的 APK。
      # 注意：不要用「先 build 通用包、再 build --target-platform android-arm64」，
      # 因为后者输出的仍然叫 app-release.apk，会把通用包覆盖掉。
      # tee 把完整输出写进 build.log，失败时能拿到全部报错。
      - name: 编译 APK（按 ABI 分包）
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      # ---------- 9.5 核对签名证书 ----------
      # 只靠「注入脚本没报错」还不够 —— 万一 Gradle 没吃那份 key.properties
      # （比如路径写成相对、或者被 AGP 的新语法绕过去），产物照样是 debug 签名的。
      # 这里直接读**产物里的证书指纹**，对不上就失败。
      # 期望值和 签名密钥/README-必读.md 里记的是同一个。
      - name: 核对签名证书
        run: |
          set +e
          EXPECT_SHA256="06:1b:e4:e1:99:cb:90:e0:a9:75:11:b2:a5:55:54:2b:4c:be:5a:58:cf:03:d8:ce:d3:9a:e0:85:a7:65:7f:3d"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AS=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$AS" ]; then
            echo "::warning::没找到 apksigner（SDK=$SDK），跳过签名核对"
            exit 0
          fi
          echo "apksigner: $AS"
          BAD=0
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "----- $f -----"
            OUT=$("$AS" verify --print-certs "$f" 2>&1)
            echo "$OUT" | grep -E "certificate (SHA-256|SHA-1) digest|Verified using" || true
            GOT=$(echo "$OUT" | grep -m1 -i "certificate SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f')
            if [ -z "$GOT" ]; then
              echo "!!! 读不到证书指纹"; BAD=1; continue
            fi
            if [ "$GOT" = "$EXPECT_SHA256" ]; then
              echo "  -> 指纹匹配 ✅"
            else
              echo "  -> 指纹不匹配 ❌"
              echo "     期望 $EXPECT_SHA256"
              echo "     实得 $GOT"
              BAD=1
            fi
          done
          if [ "$BAD" = "1" ]; then
            if [ "$SIGNED" = "yes" ]; then
              echo "::error::产物签名和固定密钥对不上，这个包装不上旧版本，中止发布"
              exit 1
            fi
            echo "::warning::签名不是固定密钥（本次没配 Secrets），不中止但不要拿它覆盖安装"
          fi
          echo "签名核对结束"

      # ---------- 10. 上传产物 ----------
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 90
          if-no-files-found: warn

      # ---------- 11. 发布 Release ----------
      # Release 里是直接的 .apk 文件，点一下就能下载，不用先下 zip 再解压。
      # v1.9.0：版本号从 pubspec.yaml 动态提取，
      # 不再 hardcode 1.8.0，否则发包忘改会一直显示旧版本号。
      - name: 提取版本号
        id: get_ver
        run: |
          VER=$(grep -E "^version:" pubspec.yaml | head -1 | sed -E "s/^version:\s*([0-9.]+).*/\1/")
          echo "APP_VER=$VER" >> $GITHUB_ENV
          echo "extracted: $VER"
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 学聚 APK v${{ github.run_number }}（${{ env.APP_VER }}）
          body: |
            ${{ env.SIGN_NOTE }}

            **下载**：近几年手机装 `arm64-v8a`，2016 年前的老机型装 `armeabi-v7a`。

            **本版（${{ env.APP_VER }}）改了什么**：见仓库 README 的「更新记录」章节。

            安装前需在手机上允许「安装未知来源应用」。

          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          fail_on_unmatched_files: false

      # ---------- 12. 失败时：把日志推送到 ci-logs 分支 ----------
      # 这样即使不登录 GitHub、不提供 token，也能直接读到完整的构建报错。
      - name: 失败时导出日志到 ci-logs 分支
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/logdump
          cd "$GITHUB_WORKSPACE"

          cp analyze.log build.log pub-get.log /tmp/logdump/ 2>/dev/null
          cp gitee-diag.txt /tmp/logdump/ 2>/dev/null
          cp pubspec.lock /tmp/logdump/ 2>/dev/null

          flutter doctor -v > /tmp/logdump/flutter-doctor.log 2>&1
          java -version > /tmp/logdump/java-version.log 2>&1
          {
            echo "===== Flutter 版本 ====="; flutter --version 2>&1
            echo "===== ANDROID_SDK_ROOT ===== $ANDROID_SDK_ROOT"
            echo "===== 已装 NDK ====="; ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "(无 ndk 目录)"
            echo "===== 已装 Android Platform ====="; ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null
            echo "===== Android 构建脚本 ====="
            ls -1 android/app/build.gradle* 2>/dev/null
            cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts 2>/dev/null
            echo "===== settings 脚本 ====="
            cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null
            echo "===== gradle wrapper 版本 ====="
            cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
            echo "===== 清单 ====="
            cat android/app/src/main/AndroidManifest.xml 2>/dev/null
          } > /tmp/logdump/env-info.log 2>&1

          echo "===== 导出内容 ====="
          ls -la /tmp/logdump/

          cd /tmp/logdump
          git init -b ci-logs -q
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af
          git commit -q -m "构建失败日志 $(date -u +%Y%m%dT%H%M%SZ)" || echo "无内容可提交"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs && echo "日志已推送到 ci-logs 分支"

      # ---------- 13. 同时留一份 Artifact（方便人工下载）----------
      - name: 失败时上传日志 Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
            pub-get.log
          retention-days: 30
          if-no-files-found: ignore



  # ============================================================
  # 同步到 Gitee 镜像（独立 job）
  # 为什么单独拆一个 job：
  #   跨境从 Azure 往 Gitee 推 40 MB 的 APK，实测慢到 30 分钟都推不完
  #   （第一次放进 build 里，直接被 step 超时掐死）。拆出来之后：
  #     · build 8 分钟出包、立刻建 GitHub Release —— 你马上能下载
  #     · Gitee 镜像在后台慢慢追，追多久都不影响 GitHub 上的发布
  # ============================================================
  gitee:
    name: 同步到 Gitee 镜像
    runs-on: ubuntu-latest
    needs: build
    # 实测每个 21 MB 的包要推 ~20 分钟，两个包 ~39 分钟，留一次重试的余量
    timeout-minutes: 55
    steps:
      - name: 拉取代码（全量历史）
        uses: actions/checkout@v4
        with:
          # 浅克隆往另一个远端 push 会被 "shallow update not allowed" 拒绝
          fetch-depth: 0

      - name: 取回构建好的 APK
        uses: actions/download-artifact@v4
        with:
          name: studyhub-apk
          path: /tmp/apk

      - name: 推源码 / tag / APK 到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # 仓库路径（不是完整网址）：https://gitee.com/yin-cheng-lu/StudyHub
          GITEE_REPO: yin-cheng-lu/StudyHub
        run: |
          set +e
          # 全程留日志，最后推到 ci-logs 分支 —— 不登录 GitHub 也能读：
          #   https://raw.githubusercontent.com/<repo>/ci-logs/gitee.log
          exec > >(tee -a "$GITHUB_WORKSPACE/gitee.log") 2>&1

          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::没配 GITEE_TOKEN，跳过 Gitee 同步"
            exit 0
          fi

          T0=$(date +%s)
          used() { echo "$(( $(date +%s) - T0 ))s"; }
          TAG="v${GITHUB_RUN_NUMBER}"
          BUILD="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA}"
          APP_VER=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:\s*([0-9.]+).*/\1/')
          GIT_URL="https://yin-cheng-lu:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          WEB="https://gitee.com/${GITEE_REPO}"
          echo "目标仓库：${GITEE_REPO}    tag：${TAG}    版本：${APP_VER}"

          # 大包走 http 推送，缓冲区放开；同时**必须开启低速中断**：
          # 不开的话连接一旦僵住，git 会一直等（第一版就是这样耗到 job 超时）。
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 120
          git config --global http.version HTTP/1.1
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ---- 1. 源码：推到 Gitee 仓库自己的默认分支 ----
          # 分支名用 ls-remote 现查、不调 API —— Gitee 的匿名 API 限流很凶
          # （构建机 IP 直接 403 Rate Limit Exceeded），ls-remote 稳得多。
          HEADS=$(git ls-remote --heads "$GIT_URL" 2>/dev/null | awk '{print $2}' | sed 's#refs/heads/##')
          DEF=$(printf '%s\n' "$HEADS" | grep -x -e main -e master | head -1)
          [ -z "$DEF" ] && DEF=$(printf '%s\n' "$HEADS" | grep -vx 'apk' | head -1)
          [ -z "$DEF" ] && DEF=main
          echo "Gitee 默认分支：${DEF}"

          echo "[1/4] 推源码 → ${DEF}"
          git push --progress --force "$GIT_URL" "HEAD:refs/heads/${DEF}" \
            && echo "  源码 OK（用掉 $(used)）" \
            || echo "::warning::源码推送失败（多半是 GITEE_TOKEN 权限不足或仓库路径不对）"

          # ---- 2. tag ----
          echo "[2/4] 推 tag ${TAG}"
          git tag -f "$TAG" >/dev/null 2>&1
          git push --progress -f "$GIT_URL" "refs/tags/${TAG}" \
            && echo "  tag OK（用掉 $(used)）"

          echo "[3/4] 推 APK"
          # 只镜像手机真用得上的两个 ABI。
          # 构建其实还会出一个 app-x86_64-release.apk（模拟器用，23 MB），
          # 三个一起推 = 66 MB，跨境传到 Gitee 会直接僵死（第一版就是这么挂的）。
          rm -rf /tmp/apkpush && mkdir -p /tmp/apkpush
          cd /tmp/apkpush
          git init -q -b apk
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<EOF
          {"version":"${APP_VER}","build":${BUILD},"tag":"${TAG}",
           "commit":"${SHA}","built_at":"${NOW}","repo":"${GITEE_REPO}"}
          EOF

          cat > README.md <<EOF
          # 学聚 APK（自动发布，勿手改）

          当前版本 **${APP_VER}**，构建编号 **${BUILD}**，tag \`${TAG}\`，提交 \`${SHA}\`。

          - 64 位（绝大多数手机）：[app-arm64-v8a-release.apk](${WEB}/raw/apk/app-arm64-v8a-release.apk)
          - 32 位（老机型）：[app-armeabi-v7a-release.apk](${WEB}/raw/apk/app-armeabi-v7a-release.apk)

          > 注：Gitee 对大文件 raw 下载要求登录，未登录访问这两个链接会被拒。

          本分支每次构建都会被整体覆盖（force push），只保留最新一版。
          历史版本见 GitHub Releases 或本仓库对应的 tag。
          EOF

          git add latest.json README.md
          git commit -q -m "说明 ${TAG}（${APP_VER}）"

          # 逐个包推、一个包一次请求：
          #   · 单次 21 MB 比一次 66 MB 成功率高得多
          #   · 后一个失败不影响已经推上去的前一个
          #   · 每次尝试最多 25 分钟（timeout 兜底），低速 2 分钟即中断重试
          push_one() {
            F="$1"; TRIES="$2"; N=1
            if [ ! -f "/tmp/apk/${F}" ]; then
              echo "  ${F} 不在产物里，跳过"
              return 1
            fi
            cp "/tmp/apk/${F}" .
            git add -A
            git commit -q -m "${F} ${TAG}（${APP_VER}）"
            while [ "$N" -le "$TRIES" ]; do
              echo "  第 ${N}/${TRIES} 次推 ${F}（已用 $(used)）..."
              if timeout 1200 git push --progress -f "$GIT_URL" HEAD:refs/heads/apk; then
                echo "  ${F} 完成（累计 $(used)）"
                return 0
              fi
              echo "  ${F} 第 ${N} 次失败（累计 $(used)），10 秒后重试"
              N=$((N + 1))
              sleep 10
            done
            echo "::warning::${F} 推了 ${TRIES} 次都没上去"
            return 1
          }

          # 实测：每个 21 MB 的包从海外 runner 推到 Gitee 要 ~20 分钟，
          # 两个包约 39 分钟。所以先推 arm64（人人都用得上），
          # 推完时间还富余再补 32 位，避免把 job 超时顶穿。
          OKN=0
          push_one app-arm64-v8a-release.apk 3 && OKN=$((OKN + 1))
          ELAPSED=$(( $(date +%s) - T0 ))
          if [ "$OKN" = "1" ] && [ "$ELAPSED" -le 1800 ]; then
            push_one app-armeabi-v7a-release.apk 1 && OKN=$((OKN + 1))
          else
            echo "  已用 ${ELAPSED}s，32 位包这次不推"
          fi
          echo "本次成功推上去 ${OKN} 个 APK（共 $(used)）"
          cd "$GITHUB_WORKSPACE"

          # ---- 4. 发行版（可选，只是给个版本页；不再上传附件）----
          # 附件上传接口 POST /releases/{id}/attach_files 在外网 runner 上
          # 长期无响应（一直挂到超时），v71~v75 连试五版全部失败，已弃用。
          echo "[4/4] 建 Gitee 发行版（可选）"
          BODY="APK 直接点下面两个链接下载：

          - [app-arm64-v8a-release.apk](${WEB}/raw/apk/app-arm64-v8a-release.apk) —— 64 位，近年手机优先装这个
          - [app-armeabi-v7a-release.apk](${WEB}/raw/apk/app-armeabi-v7a-release.apk) —— 32 位，老机型才需要

          > Gitee 大文件 raw 下载需要先登录 Gitee 账号。

          版本 ${APP_VER}，构建编号 ${BUILD}，源码提交 ${SHA}。"

          HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" \
            --connect-timeout 20 --max-time 90 \
            -X POST "${API}/releases" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "name=学聚 APK ${TAG}（${APP_VER}）" \
            --data-urlencode "body=${BODY}" \
            --data-urlencode "prerelease=false" \
            --data-urlencode "target_commitish=${DEF}")
          echo "  发行版 HTTP ${HTTP}：$(head -c 200 /tmp/rel.json)"

          echo "----- Gitee 镜像就绪（总用时 $(used)）-----"
          echo "  源码：${WEB}/tree/${DEF}"
          echo "  64 位：${WEB}/raw/apk/app-arm64-v8a-release.apk"
          echo "  32 位：${WEB}/raw/apk/app-armeabi-v7a-release.apk"
          sleep 2

      # 同步的完整日志推到 ci-logs 分支：anon 可读，出问题不用登 GitHub 翻 Actions
      - name: 同步日志推到 ci-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          [ -f gitee.log ] || { echo "没有 gitee.log"; exit 0; }
          wc -l gitee.log
          rm -rf /tmp/cilogs
          if git clone -q --depth 1 --branch ci-logs \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cilogs 2>/dev/null; then
            cp gitee.log /tmp/cilogs/gitee.log
          else
            mkdir -p /tmp/cilogs && cd /tmp/cilogs
            git init -q -b ci-logs
            cp "$GITHUB_WORKSPACE/gitee.log" .
          fi
          cd /tmp/cilogs
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "gitee 同步日志 $(date -u +%Y%m%dT%H%M%SZ)" || echo "无变化"
          git push -f origin HEAD:ci-logs && echo "日志已推送"
